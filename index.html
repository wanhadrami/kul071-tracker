<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a5c">
<title>KUL071 Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a native phone app for the site walk; fast, tactile, one thumb.
   IDEA: rooms are tiles you walk into; each activity is a card you swipe or dial.
   PICTURE: navy hero with the live outstanding count, room tiles with animated rings.
   COLOUR+TYPE: PMX navy #18489c/#0f2a5c, Romp 3 sky #2f8fd8, Romp 4 PMX red #d23a46, blush #f0a0a8; Plus Jakarta Sans.
   LAYOUT: phone column max 480px, sliding screens, bottom tab bar, bottom sheet editor. */
:root{color-scheme:light dark;--bg:light-dark(#eef2f9,#070d1a);--card:light-dark(#fff,#111a2e);--card2:light-dark(#f4f7fc,#18233c);--ink:light-dark(#0c1730,#eef2fb);--mute:light-dark(#6a7690,#8b98b4);--line:light-dark(#e2e8f3,#1f2b47);
--navy:#18489c;--deep:#0f2a5c;--r3:#2f8fd8;--r4:#d23a46;--blush:#f0a0a8;--sky:#8cc4ea;--ok:#1fb877;--late:#f29a2e;--soft:light-dark(#e7edf8,#1a2643);--navy2:light-dark(#18489c,#7fb0ff);--sh:0 8px 28px light-dark(rgba(15,42,92,.10),rgba(0,0,0,.45))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:light-dark(#dfe6f2,#03070f)}
body{color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip;box-shadow:0 0 60px rgba(0,0,0,.15)}
.scr{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(96px + env(safe-area-inset-bottom));transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s;will-change:transform}
.scr.off-r{transform:translateX(100%)}.scr.off-l{transform:translateX(-22%);opacity:.4;pointer-events:none}.scr.hide{display:none}
/* hero */
.hero{background:radial-gradient(120% 90% at 100% 0,#2c5fc0 0,transparent 60%),linear-gradient(160deg,#18489c,#0f2a5c 70%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 64px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:190px;height:190px;background:conic-gradient(from 30deg,#d23a46 0 60deg,#f0a0a8 0 120deg,#8cc4ea 0 180deg,#2f8fd8 0 240deg,#3c3c78 0 300deg,#18489c 0);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:.22}
.hrow{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hello{font-size:13px;opacity:.8}.proj{font-weight:800;font-size:17px}
.hbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;backdrop-filter:blur(8px)}
.hbtn svg{width:20px;height:20px}
.count{position:relative;z-index:1;margin-top:22px;display:flex;align-items:flex-end;gap:12px}
.count .big{font-size:64px;font-weight:800;line-height:.9;letter-spacing:-2px}
.count span{font-size:14px;opacity:.85;padding-bottom:6px}
.pills{position:relative;z-index:1;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.pill.l{background:rgba(242,154,46,.25);color:#ffd29a}.pill.b{background:rgba(210,58,70,.3);color:#ffc2c7}
/* romp switch */
.sw{margin:-30px 16px 0;position:relative;z-index:2;background:var(--card);border-radius:20px;padding:6px;display:grid;grid-template-columns:1fr 1fr 1fr;box-shadow:var(--sh)}
.sw i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:15px;background:var(--c);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s}
.sw button{position:relative;z-index:1;height:48px;font-weight:800;font-size:15px;color:var(--mute);transition:color .3s}
.sw button[aria-pressed=true]{color:#fff}.sw small{display:block;font-size:11.5px;font-weight:600;opacity:.85;margin-top:-2px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 20px 10px}.sec h2{font-size:17px;font-weight:800;margin:0}.sec span{font-size:13px;color:var(--mute)}
/* room tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
.tile{background:var(--card);border-radius:22px;padding:14px;text-align:left;box-shadow:var(--sh);position:relative;transition:transform .15s;animation:pop .45s backwards}
.tile:active{transform:scale(.96)}
.tile .ring{width:58px;height:58px;position:relative}.tile .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.tile h3{margin:12px 0 0;font-size:16px;font-weight:800}.tile p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.tile .lt{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:800;color:#fff;background:var(--late);border-radius:999px;padding:3px 8px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
svg.rg{width:100%;height:100%;transform:rotate(-90deg)}svg.rg .v{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
/* priority strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.pc{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:14px;text-align:left;box-shadow:var(--sh);border-left:5px solid var(--late)}
.pc b{display:block;font-size:14.5px;line-height:1.3}.pc span{display:block;font-size:12px;color:var(--mute);margin-top:4px}.pc em{font-style:normal;font-weight:800;color:var(--late);font-size:12.5px}
/* search */
.srch{margin:16px 16px 0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--sh)}
.srch svg{width:18px;height:18px;color:var(--mute);flex:none}.srch input{flex:1;border:0;background:none;height:48px;font-size:16px;outline:none}
/* room screen */
.top{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh)}.back svg{width:20px;height:20px}
.top h2{margin:0;font-size:19px;font-weight:800}.top small{display:block;color:var(--mute);font-size:12.5px}
.prog{margin:4px 16px 14px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;border-radius:4px;background:var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hint{margin:0 16px 12px;font-size:12.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}.hint b{color:var(--ink)}
.fchips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:13px;color:var(--mute);box-shadow:0 1px 2px rgba(0,0,0,.05)}.fc[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* swipe card */
.sl{position:relative;margin:0 16px 10px;border-radius:20px;overflow:hidden;animation:pop .4s backwards}
.sl:not(.sw-on) .under{opacity:0}.under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(90deg,var(--ok) 50%,var(--navy) 50%)}
.under span{display:flex;align-items:center;gap:8px}
.ac{position:relative;background:var(--card);border-radius:20px;padding:14px;display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;align-items:center;touch-action:pan-y;user-select:none;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh)}
.ac.drag{transition:none}
.ac .ring{width:50px;height:50px;position:relative}.ac .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.ac h4{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:5px;font-size:12px;color:var(--mute);align-items:center}
.tg{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:light-dark(#18489c,#9cc2ff)}
.tg.l{background:color-mix(in srgb,var(--late) 20%,transparent);color:light-dark(#9a5300,#ffc27a)}.tg.b{background:color-mix(in srgb,var(--r4) 18%,transparent);color:light-dark(#a3222c,#ffa3aa)}.tg.p{background:color-mix(in srgb,var(--ok) 18%,transparent);color:light-dark(#0b7a4c,#6fe3ad)}
.empty{text-align:center;padding:60px 30px;color:var(--mute)}.empty b{display:block;font-size:22px;color:var(--ink);margin-bottom:6px}.empty .e{font-size:44px}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(5,12,28,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:28px 28px 0 0;z-index:21;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1);overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0;font-size:19px;font-weight:800;line-height:1.25}.sheet .sub{font-size:12.5px;color:var(--mute);margin-top:4px}
.dial{position:relative;width:230px;height:230px;margin:14px auto 4px;touch-action:none}
.dial svg{width:100%;height:100%}.dial .knob{transition:none}
.dial .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dial .mid b{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1}.dial .mid span{font-size:13px;color:var(--mute);font-weight:700;margin-top:4px}
.dhint{text-align:center;font-size:12px;color:var(--mute)}
.qp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.qp button{height:46px;border-radius:14px;background:var(--card2);font-weight:800;font-size:14px;transition:transform .12s}.qp button:active{transform:scale(.94)}
.qp button[aria-pressed=true]{background:var(--navy);color:#fff}.qp .dn[aria-pressed=true]{background:var(--ok)}
.lb{font-size:12px;font-weight:800;color:var(--mute);margin:18px 0 8px}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgl{height:48px;border-radius:14px;background:var(--card2);font-weight:700;font-size:14px;border:2px solid transparent}.tgl[aria-pressed=true]{border-color:var(--navy);color:light-dark(#18489c,#9cc2ff);background:color-mix(in srgb,var(--navy) 10%,var(--card2))}
.in{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);padding:12px 14px;font-size:16px}
textarea.in{min-height:70px;resize:none}
.dates{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-top:12px}.dates button{color:light-dark(#18489c,#9cc2ff);font-weight:800;padding:8px 0}
.dd{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.dd.on{display:grid}
.photos{display:flex;gap:10px;overflow-x:auto}.photos a,.photos button{flex:none;width:78px;height:78px;border-radius:16px;overflow:hidden;background:var(--card2);display:grid;place-items:center;color:var(--mute);font-size:12px;font-weight:700;border:2px dashed var(--line)}.photos img{width:100%;height:100%;object-fit:cover}
.photos button svg{width:24px;height:24px}
.save{width:100%;height:56px;border-radius:18px;background:linear-gradient(135deg,#2459bf,#18489c);color:#fff;font-weight:800;font-size:16px;margin-top:20px;box-shadow:0 10px 24px rgba(24,72,156,.35)}
.save:disabled{opacity:.5}.err{color:var(--r4);font-weight:700;font-size:13px;margin-top:10px;min-height:1em;text-align:center}
.hist{font-size:12px;color:var(--mute);margin:14px 0 0;padding-left:16px}
/* tab bar */
.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tabs button{height:54px;border-radius:18px;display:grid;place-items:center;align-content:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--mute);transition:.2s}
.tabs svg{width:22px;height:22px}.tabs button[aria-selected=true]{color:#fff;background:var(--navy)}
/* dashboard */
.dh{padding:calc(18px + env(safe-area-inset-top)) 20px 6px}.dh h2{margin:0;font-size:24px;font-weight:800}.dh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0}
.rc{background:var(--card);border-radius:24px;padding:16px 12px;text-align:center;box-shadow:var(--sh)}
.rc .ring{width:120px;height:120px;margin:0 auto;position:relative}.rc .ring div{position:absolute;inset:0;display:grid;place-content:center}
.rc .ring b{font-size:28px;font-weight:800}.rc .ring span{font-size:11px;color:var(--mute);font-weight:700}
.rc h3{margin:10px 0 2px;font-size:15px;font-weight:800}.rc p{margin:0;font-size:12px;color:var(--mute)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 0}
.k{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh)}.k b{display:block;font-size:30px;font-weight:800;line-height:1.1}.k span{font-size:12.5px;color:var(--mute);font-weight:600}
.panel{background:var(--card);border-radius:24px;padding:16px;margin:12px 16px 0;box-shadow:var(--sh)}.panel h3{margin:0 0 12px;font-size:15px;font-weight:800}
.br{display:grid;grid-template-columns:minmax(0,5.5em) minmax(0,1fr) 2.8em;gap:10px;align-items:center;margin:10px 0;font-size:13px;font-weight:600}
.trk{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}.trk i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.br .n{text-align:right;font-weight:800}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px;text-align:left;width:100%}.li:first-of-type{border-top:0}.li small{display:block;color:var(--mute);font-size:12px}.li em{font-style:normal;font-weight:800;white-space:nowrap}
/* walk */
.wbar{position:relative;z-index:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:16px;overflow:hidden}.wbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8cc4ea,#fff);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.how{display:flex;gap:6px;margin:16px 16px 0;font-size:11.5px;color:var(--mute);font-weight:700}.how span{flex:1;background:var(--card);border-radius:12px;padding:8px;display:flex;gap:6px;align-items:center;line-height:1.2}.how b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);font-size:11px}
.route{margin:0 16px;background:var(--card);border-radius:24px;padding:6px 14px;box-shadow:var(--sh)}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;position:relative;animation:pop .4s backwards}
.step+.step{border-top:1px solid var(--line)}
.step .sn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line);color:var(--mute)}
.step.part .sn{border-color:var(--c);color:var(--c)}.step.done .sn,.step.none .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.step b{display:block;font-size:15.5px;font-weight:800}.step small{font-size:12.5px;color:var(--mute)}.step em{font-style:normal;color:var(--late);font-weight:700}
.step .sc{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}.step.part .sc{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}.step.done .sc,.step.none .sc{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.ctaw{padding:16px 16px 0}.cta{width:100%;min-height:58px;border-radius:18px;background:linear-gradient(135deg,#2459bf,#18489c);color:#fff;font-weight:800;font-size:16px;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(24,72,156,.35);padding:0 16px}.cta.ok{background:linear-gradient(135deg,#22c47f,#139a60);box-shadow:0 10px 24px rgba(19,154,96,.3)}
.cta span{font-size:20px}
.dots{display:flex;gap:4px;padding:0 16px 10px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--soft)}.dots i.ok{background:var(--ok)}.dots i.cur{background:var(--c)}
.wc{margin:4px 16px 0;background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--sh);border-top:5px solid var(--c)}.wc.in{animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}
.wct{display:flex;flex-wrap:wrap;gap:6px}.wc h3{margin:12px 0 2px;font-size:21px;font-weight:800;line-height:1.25}.wid{font-size:12.5px;color:var(--mute);font-weight:600}
.wnow{display:flex;gap:14px;align-items:center;margin-top:16px;background:var(--card2);border-radius:18px;padding:12px}.wnow .ring{width:64px;height:64px;position:relative;flex:none}.wnow .ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.wnow span{display:block;font-size:11.5px;color:var(--mute);font-weight:700}.wnow b{font-size:14px}.wnow em{display:block;font-style:normal;font-size:12.5px;color:var(--r4);font-weight:700;margin-top:3px}
.q{margin:18px 20px 8px;font-weight:800;font-size:15px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.an{min-height:76px;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:15px;display:grid;place-items:center;align-content:center;gap:2px;border:2px solid transparent;transition:transform .12s}.an:active{transform:scale(.96)}
.an span{font-size:22px;line-height:1}.an.on{border-color:var(--navy)}.an.dn{background:var(--ok);color:#fff}.an:disabled{opacity:.5}
.pnl{margin:12px 16px 0;background:var(--card);border-radius:22px;padding:4px 16px 16px;box-shadow:var(--sh);animation:pop .3s}
.qp4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qp4 button{height:52px;border-radius:14px;background:var(--card2);font-weight:800;font-size:16px}.qp4 button[aria-pressed=true]{background:var(--navy);color:#fff}
.tools{display:flex;justify-content:space-between;gap:8px;margin:16px 16px 0}.tools button{flex:1;min-height:44px;border-radius:14px;background:var(--card);font-weight:700;font-size:13px;color:var(--mute)}.tools button:disabled{opacity:.4}
.rdone{padding:20px 16px;text-align:center}.big-ok{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:42px;display:grid;place-items:center;margin:10px auto;animation:pop .5s}
.rdone h3{margin:6px 0 2px;font-size:22px;font-weight:800}.rdone p{margin:0;color:var(--mute)}
.rs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.rs div{background:var(--card);border-radius:16px;padding:12px 4px;box-shadow:var(--sh)}.rs b{display:block;font-size:22px;font-weight:800}.rs span{font-size:11.5px;color:var(--mute);font-weight:700}
.ghost{width:100%;min-height:48px;border-radius:16px;margin-top:10px;font-weight:800;color:light-dark(#18489c,#9cc2ff);background:var(--card)}
/* walk v2 */
body.walking .tabs{transform:translateY(140%);opacity:0;pointer-events:none}.tabs{transition:transform .3s,opacity .3s}

<script>
{
const $=s=>document.querySelector(s);

  'ELECTRICAL 1.2 (ROMP4)':['R4','E1.2','Electrical room'],'DAHU 07':['R4','DAHU 07','AHU room'],'DAHU 08':['R4','DAHU 08','AHU room'],'DATA HALL ROMP 4':['R4','Data Hall','White space'],'GROUND FLOOR MEZZANINE':['R4','GF Mezz','Mezzanine'],
  'CHILLER PLANT ROOM':['R4','Chiller','Plant room'],'GENSET YARD':['R4','Genset','Yard'],'ROOF FLOOR':['RF','Roof','Roof']};

const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'–';

const IC={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 edit:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>'};
let B={acts:[],at:0,dd:''},A=[],U={},db=null,user=null,assets=null,dl=null,canWrite=true,canAdmin=false,me=null,names={},prevBase=null;

/* ---------- XER ---------- */
function parseXER(txt){
  const T={};let t=null;
  for(const line of txt.split(/\r?\n/)){const c=line.split('\t');
    if(c[0]==='%T'){t=c[1];T[t]={f:[],r:[]}}else if(c[0]==='%F')T[t].f=c.slice(1);
    else if(c[0]==='%R'){const o={};T[t].f.forEach((k,i)=>o[k]=c[i+1]??'');T[t].r.push(o)}}
  if(!T.TASK||!T.PROJWBS)throw new Error('Not a P6 XER file');
  const W={};T.PROJWBS.r.forEach(r=>W[r.wbs_id]=r);
  const AT={};(T.ACTVTYPE?.r||[]).forEach(r=>AT[r.actv_code_type_id]=r.actv_code_type);
  const AC={};(T.ACTVCODE?.r||[]).forEach(r=>AC[r.actv_code_id]=[AT[r.actv_code_type_id],r.short_name]);
  const tc={};(T.TASKACTV?.r||[]).forEach(r=>{const a=AC[r.actv_code_id];if(a)(tc[r.task_id]??={})[a[0]]=a[1]});
  const path=i=>{const s=[];while(W[i]&&W[W[i].parent_wbs_id]){s.push(W[i].wbs_name.trim());i=W[i].parent_wbs_id}return s.reverse()};
  const d=s=>(s||'').slice(0,10),acts=[];
  for(const x of T.TASK.r){const pp=path(x.wbs_id);if(pp[0]!=='CONSTRUCTION')continue;
    const c=tc[x.task_id]||{},st={TK_NotStart:'N',TK_Active:'A',TK_Complete:'C'}[x.status_code]||'N';
    const od=(+x.target_drtn_hr_cnt||0)/8,rd=(+x.remain_drtn_hr_cnt||0)/8,pt=x.complete_pct_type==='CP_Phys'?'P':'D';
    const pct=st==='C'?100:st==='N'?0:pt==='P'?Math.round(+x.phys_complete_pct||0):(od?Math.max(0,Math.min(99,Math.round(100*(1-rd/od)))):0);
    acts.push({id:x.task_code,nm:x.task_name.trim(),sn:x.task_name.replace(/^(\s*[\[\(][^\]\)]*[\]\)]\s*)+/,'').trim(),lvl:pp[1]||'',area:pp[pp.length-1],
      sys:c['Combine System']||'',trade:c['Trade Romp 3&4']||'',scope:c['Scope of Works']||'',romp:c['Romp']||'',pt,st,pct,
      as:d(x.act_start_date),af:d(x.act_end_date),ps:d(x.target_start_date),pf:d(x.target_end_date),ef:d(x.early_end_date),od:+od.toFixed(2),rd:+rd.toFixed(2)})}
  const P=T.PROJECT?.r?.[0]||{};return {dd:(P.last_recalc_date||'').slice(0,10),proj:P.proj_short_name||'',acts};
}
const disc=a=>a.scope==='KJM'?'':(a.sys==='Mech'||a.sys==='Diesel')?'MECH':(a.sys==='Elec'||a.sys==='BMS'||(!a.sys&&(a.trade==='Ele'||a.trade==='Diesel')))?'ELE':(['FP','FS','Vesda'].includes(a.sys)||(!a.sys&&a.trade==='FP'))?'FIRE':'';
const dn=s=>s?Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5):0;
function setBase(b){B=b;A=b.acts.filter(a=>ROOMS[a.area]&&disc(a)).map(a=>({...a,R:ROOMS[a.area][0],rm:ROOMS[a.area][1],D:disc(a)}))}

/* ---------- logic ---------- */
const eff=a=>{const u=U[sid(a.id)];if(u&&u.pat&&u.pat>B.at)return{st:u.st,pct:u.pct,as:u.as||'',af:u.af||'',src:'site'};return{st:a.st,pct:a.pct,as:a.as,af:a.af,src:'p6'}};
const pend=a=>{const e=eff(a);return e.src==='site'&&(e.st!==a.st||e.pct!==a.pct||e.as!==a.as||e.af!==a.af)};
const isOpen=a=>eff(a).st!=='C',late=a=>isOpen(a)&&a.pf&&a.pf<today(),blk=a=>isOpen(a)&&!!U[sid(a.id)]?.cons;
const remDur=(a,e)=>e.st==='C'?0:+(a.od*(1-e.pct/100)).toFixed(1);
const daysLate=a=>Math.round((new Date(today())-new Date(a.pf))/864e5);
const ring=(p,sw,col,anim)=>{const r=50-sw/2,c=2*Math.PI*r;return`<svg class="rg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${sw}"/><circle class="v" cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${anim?0:c*p/100} ${c}" data-d="${c*p/100} ${c}"/></svg>`};
const animate=el=>requestAnimationFrame(()=>requestAnimationFrame(()=>{el.querySelectorAll('.v[data-d]').forEach(v=>v.setAttribute('stroke-dasharray',v.dataset.d));el.querySelectorAll('[data-w]').forEach(i=>i.style.width=i.dataset.w);el.querySelectorAll('[data-n]').forEach(countUp)}));
function countUp(el){const to=+el.dataset.n,dc=+(el.dataset.dec||0),t0=performance.now(),dur=900;if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to.toFixed(dc);return}
  const f=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=(to*(1-Math.pow(1-k,3))).toFixed(dc);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

/* ---------- site walk ---------- */
const ORDER={R3:['ELECTRICAL 2.2 (ROMP3)','DAHU 05','DAHU 06','DATA HALL ROMP 3','FIRST FLOOR MEZZANINE'],R4:['ELECTRICAL 1.2 (ROMP4)','DAHU 07','DAHU 08','DATA HALL ROMP 4','GROUND FLOOR MEZZANINE','CHILLER PLANT ROOM','GENSET YARD'],RF:['ROOF FLOOR']};
let wRoom=null,wList=[],wIdx=0,wMode='item',wPanel='',wPick=null;
const tday=ms=>ms&&ymd(new Date(ms))===today();

const WI={same:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6 4 4 6-7"/><path d="M14 8h6v6"/></svg>',
 blk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
const REASONS=['No access / area not ready','Material not on site','Waiting other trade','Drawing / RFI pending','Manpower shortage','Testing / inspection pending'];

function advance(prevId){const k=oRoom,l=roomItems(k),i=l.findIndex(a=>a.id===prevId),nx=[...l.slice(i+1),...l.slice(0,Math.max(0,i))].find(a=>!checked(a)&&a.id!==prevId);qPanel='';qVal=null;wR='';wO='';

  if(nr){toast(`${ROOMS[k][1]} done ✓ → ${ROOMS[nr][1]}`);startRoom(nr)}else{oRoom=null;oItem=null;renderHome(false);confetti();toast(`${RN[ROOMS[k][0]]} walk complete ✓`)}}

async function qStat(w,v){const a=A.find(x=>x.id===oItem);if(!a)return;const e=eff(a),f={...e,...pick(U[sid(a.id)])};f.ev=wEv;
  if(w==='s'){if(e.as){if(e.st==='C')return toast('Untick Finished first');f.st='N';f.as='';f.af='';f.pct=0}else{f.st='A';f.as=wDate}}
  else if(w==='f'){if(e.st==='C'){f.st='A';f.af='';f.pct=Math.min(e.pct,99)}else{f.st='C';f.pct=100;f.af=wDate;f.as=e.as&&e.as<=wDate?e.as:wDate}}

  $('#sheet').classList.add('on');$('#dim').classList.add('on')}
async function sSaveCell(){const {id,k,v}=sTmp,f=sFinal(id).slice(),o=SO[id],W0=sWeek(sCut);f[k]=Math.max(0,Math.min(1,v));const sg=(o&&o.w===W0&&o.sg)?o.sg.slice():[null,null,null];sg[k]=sTmp.sg;const doc={v:f,sg,w:W0,at:Date.now(),by:me||''};SO[id]=doc;closeSheet();renderSrp();
  if(db)try{await db.doc('srpo/'+id).set(doc);toast('SRP updated')}catch(e){toast('Not saved')}}
async function sAcceptAll(){const P=sPendAll(),W0=sWeek(sCut),by={};P.forEach(([id,k,v])=>{const o=SO[id],b=by[id]??={v:sFinal(id).slice(),sg:(o&&o.w===W0&&o.sg)?o.sg.slice():[null,null,null]};b.v[k]=v;b.sg[k]=v});
  const ids=Object.keys(by);ids.forEach(id=>SO[id]={...by[id],w:W0,at:Date.now(),by:me||''});renderSrp();toast(P.length+' suggestions accepted');if(db)try{await Promise.all(ids.map(id=>db.doc('srpo/'+id).set(SO[id])))}catch(e){toast('Not saved')}}
async function sReset(id){delete SO[id];closeSheet();renderSrp();if(db)try{await db.doc('srpo/'+id).delete()}catch(e){}}
async function sUploadMaster(f){if(!assets){toast('Upload not available');return}try{toast('Uploading master…');const r=await assets.upload(f);SM={id:r.id,name:f.name,at:Date.now()};if(db)await db.doc('srpm/master').set(SM);renderSrp();toast('Master SRP saved')}catch(e){toast('Upload failed')}}
const sColN=c=>[...c].reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0),sXe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sRx=ref=>new RegExp('<c r="'+ref+'"([^>]*?)(/>|>([\\s\\S]*?)</c>)');
function sPut(x,ref,mk,opt={}){const m=x.match(sRx(ref)),f=a=>mk(a).replace('"__"','"'+ref+'"');
  if(m){const inner=m[3]||'';if(opt.ifEmpty&&/<v>/.test(inner))return[x,'kept'];if(!opt.formula&&/<f[ >]/.test(inner))return[x,'formula'];let at=m[1].replace(/\s+t="[^"]*"/,'');if(opt.s)at=at.replace(/\s+s="[^"]*"/,'')+` s="${opt.s}"`;return[x.replace(m[0],f(at)),'set']}
  const r=ref.match(/\d+/)[0],rm=x.match(new RegExp('<row r="'+r+'"([^>]*?)(/>|>([\\s\\S]*?)</row>)'));if(!rm)return[x,'norow'];
  const cells=rm[3]||'',tc=sColN(ref.replace(/\d+/,''));let pos=cells.length;for(const c of cells.matchAll(/<c r="([A-Z]+)\d+"/g))if(sColN(c[1])>tc){pos=c.index;break}
  return[x.replace(rm[0],`<row r="${r}"${rm[1]}>${cells.slice(0,pos)}${f(opt.s?` s="${opt.s}"`:'')}${cells.slice(pos)}</row>`),'set']}
const sNum=v=>a=>`<c r="__"${a}><v>${v}</v></c>`,sStr=t=>a=>`<c r="__"${a} t="inlineStr"><is><t xml:space="preserve">${sXe(t)}</t></is></c>`;
const sSer=s=>Math.round((Date.parse(s)-Date.UTC(1899,11,30))/864e5);
async function sGenerate(){if(typeof JSZip==='undefined')return toast('Excel tool did not load');if(!SM.id)return toast('Upload the master SRP file first');
  toast('Building SRP…');try{const buf=await (await fetch('/_blob/'+encodeURIComponent(SM.id))).arrayBuffer();const zip=await JSZip.loadAsync(buf);
   let wb=await zip.file('xl/workbook.xml').async('string');const rels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
   const path=name=>{const m=wb.match(new RegExp('<sheet[^>]*?name="'+sXe(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'"[^>]*r:id="([^"]+)"'));if(!m)return null;const t=rels.match(new RegExp('Id="'+m[1]+'"[^>]*Target="([^"]+)"'))||rels.match(new RegExp('Target="([^"]+)"[^>]*Id="'+m[1]+'"'));return t?'xl/'+t[1].replace(/^\/?xl\//,''):null};
   const W0=sWeek(sCut),iss=[];let n=0;
   for(const s of SRP){const p=path(s.name);if(!p||!zip.file(p)){iss.push('missing sheet '+s.name);continue}let x=await zip.file(p).async('string'),r;
    if(s.k==='gfe'){const[y,mo,d]=sCut.split('-').map(Number);[x]=sPut(x,'D1',a=>`<c r="__"${a}><f>DATE(${y},${mo},${d})</f><v>${sSer(sCut)}</v></c>`,{formula:true});[x]=sPut(x,'E1',sStr('(W'+W0+')'))}
    for(const[row] of s.rows){const id=s.k+row,f=sFinal(id),st=sSite(id);
     for(let i=0;i<3;i++){[x,r]=sPut(x,SCOL.p[i]+row,sNum(Math.round(f[i]*1000)/1000));r==='set'?n++:iss.push(s.label+' '+SCOL.p[i]+row+' '+r);
      const ds=(x.match(sRx(SCOL.s[i]+row))||[])[1]?.match(/s="(\d+)"/)?.[1],L=st[i]?.l||[];
      const as=L.map(a=>eff(a).as).filter(Boolean).sort()[0],af=f[i]>=1?L.map(a=>eff(a).af).filter(Boolean).sort().pop():null;
      if(f[i]>0&&as)[x]=sPut(x,SCOL.s[i]+row,sNum(sSer(as)),{ifEmpty:true,s:ds});if(af)[x]=sPut(x,SCOL.f[i]+row,sNum(sSer(af)),{ifEmpty:true,s:ds})}}
    zip.file(p,x)}
   wb=/<calcPr[^>]*fullCalcOnLoad/.test(wb)?wb:wb.replace(/<calcPr/,'<calcPr fullCalcOnLoad="1"');zip.file('xl/workbook.xml',wb);
   const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),dd=new Date(sCut+'T00:00'),fn=`PMX Daily SRP_${dd.getDate()} ${dd.toLocaleString('en-GB',{month:'short'})} ${dd.getFullYear()}.xlsx`;
   const snap={w:W0,cut:sCut,v:Object.fromEntries(SIDS.map(id=>[id,sFinal(id)])),at:Date.now(),by:me||''};SG[W0]=snap;sMerge();if(db)try{await db.doc('srpg/'+sWid(W0)).set(snap)}catch(e){iss.push('history not saved')}
   if(dl)await dl.save({filename:fn,data:blob});renderSrp();toast(`SRP ready · ${n} cells${iss.length?' · '+iss.length+' issue(s)':''}`);if(iss.length)console.warn(iss)}
  catch(e){toast('Generate failed: '+(e.message||e.code||e))}}

/* ---------- boot ---------- */
async function boot(){
  try{const r=await fetch('baseline.json');setBase({...(await r.json()),at:0})}catch(e){}
  renderHome(true);setTimeout(()=>{if(!seen('t1'))startTour(TOUR1,'t1')},900);
  const W=window.claude;if(!W?.use){noteMsg='Preview – updates are not saved. Open the published app on your phone.';renderHome(false);return}
  [db,user,assets,dl,sampleFn]=await Promise.all(['db','user','assets','downloads','sample'].map(n=>W.use(n).catch(()=>null)));$('#aiBtn').hidden=!sampleFn;
  if(user){me=await user.id().catch(()=>null);canAdmin=!!(await user.canEdit().catch(()=>false));if((await user.can('data.write').catch(()=>null))===false){canWrite=false;noteMsg='View-only access. Ask the owner for Contributor access.'}
    if(me)try{const p=await user.profiles([me]);names[me]=p[me]?.name||''}catch(e){}}
  if(!db){noteMsg='Sign in to save updates.';rerender();return}
  let got=false;const timer=setTimeout(()=>{if(!got){noteMsg='No signal to the shared data yet – showing P6 data.';rerender()}},10000);
  db.collection('p6sum_off').onSnapshot(s=>{P6S={};s.docs.forEach(d=>P6S[d.id]=d.data());if(tab==='dash'&&!$('#sheet').classList.contains('on'))renderDash()},()=>{});
  db.collection('srpo').onSnapshot(q=>{SO={};q.docs.forEach(d=>SO[d.id]=d.data());if(tab==='srp'&&!$('#sheet').classList.contains('on'))renderSrp()},()=>{});
  db.collection('srpw').onSnapshot(q=>{SE={};q.docs.forEach(d=>{const x=d.data();if(Number.isInteger(x.w))SE[x.w]=x});sMerge();if(tab==='srp'&&hOpen==null&&!$('#sheet').classList.contains('on'))renderSrp()},()=>{});
  db.collection('srpg').onSnapshot(q=>{SG={};q.docs.forEach(d=>{const x=d.data();if(Number.isInteger(x.w))SG[x.w]=x});sMerge();if(tab==='srp'&&hOpen==null&&!$('#sheet').classList.contains('on'))renderSrp()},()=>{});
  db.doc('srpm/master').onSnapshot(d=>{SM=d.exists?d.data():{};if(tab==='srp')renderSrp()},()=>{});
  db.doc('srpm/cut').onSnapshot(d=>{if(d.exists&&/^\d{4}-\d\d-\d\d$/.test(d.data().date))sCut=d.data().date},()=>{});
  db.doc('base/current').onSnapshot(s=>{if(s.exists){const d=s.data();prevBase=d.prev||null;setBase({...d});live()}},()=>{});
  db.collection('upd').onSnapshot(async s=>{got=true;clearTimeout(timer);if(!s.metadata.fromCache&&canWrite&&noteMsg.startsWith('No signal'))noteMsg='';
    U={};s.docs.forEach(d=>U[d.id]=d.data());await resolveNames();live()},()=>{clearTimeout(timer);noteMsg='Live sync stopped – reload to reconnect.';rerender()});
  rerender();
}
async function resolveNames(){if(!user)return;const ids=[...new Set(Object.values(U).flatMap(u=>[u.by,...(u.hist||[]).map(h=>h.by)]).filter(Boolean))];
  try{const ps=await user.profiles(ids);ids.forEach(i=>names[i]=ps[i]?.name||'Someone')}catch(e){}}
function srpBadge(){const b=document.querySelector('.tabs [data-tab="srp"]');if(!b)return;let n=0;try{n=sPendAll().length}catch(e){}
  let i=b.querySelector('.tbg');if(!n){i?.remove();return}if(!i){i=document.createElement('i');i.className='tbg';b.appendChild(i)}if(i.textContent!=String(n)){i.textContent=n>99?'99+':n;i.classList.remove('pop');void i.offsetWidth;i.classList.add('pop')}
  b.setAttribute('aria-label','SRP, '+n+' suggestion'+(n>1?'s':'')+' from site walk')}
for(const f of ['renderHome','renderSrp','rerender']){const o=window[f]||eval(f);eval(f+'=function(...a){const r=o.apply(this,a);srpBadge();return r}')}
boot();
}
